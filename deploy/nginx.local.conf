# MILESTONE 7 — Nginx in front of the app.
#
# This file is half of the rate limiter's trust boundary. The other half is
# server.forward-headers-strategy=framework in application.yml. Both are
# required; neither works alone. See docs/decisions.md.
#
# Complete nginx.conf — on Ubuntu, replace /etc/nginx/nginx.conf with this.
# Validate before reloading:  sudo nginx -t && sudo systemctl reload nginx

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'uct=$upstream_connect_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;        # do not advertise the version to probes

    # MUST be at http level — nginx rejects limit_req_zone inside a server
    # block. The app rate-limits per IP too, but that happens after a request
    # has already reached the JVM; this is the cheap outer bound that stops a
    # flood getting that far. Keep it comfortably above the app's own limits,
    # or this silently becomes the real limit and the app's config is fiction.
    limit_req_zone $binary_remote_addr zone=shortener:10m rate=50r/s;

    upstream shortener {
        server host.docker.internal:8080;
        keepalive 64;
    }

    server {
        listen 80 default_server;
        server_name _;

        limit_req zone=shortener burst=100 nodelay;

        location / {
            proxy_pass http://shortener;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # THE LOAD-BEARING LINE.
            #
            # proxy_set_header OVERWRITES the header. If this were
            # `$proxy_add_x_forwarded_for` instead, nginx would APPEND the real
            # client to whatever the client sent, so a client sending
            # `X-Forwarded-For: 1.2.3.4` produces "1.2.3.4, <real ip>".
            # Spring's ForwardedHeaderFilter takes the FIRST entry as the
            # client, so an attacker would choose their own rate-limit bucket
            # and bypass the limit by sending a fresh value per request.
            #
            # Overwriting means the app only ever sees an address nginx
            # observed on the TCP connection. If a CDN or second proxy is ever
            # put in front of this one, revisit: $remote_addr is then no
            # longer the real client.
            proxy_set_header X-Forwarded-For $remote_addr;

            # The redirect is the product; do not hold a browser tab blank.
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Health and metrics should not be reachable from the internet.
        # Narrow this to your VPC/subnet, or drop it to deny all but localhost.
        location /actuator/ {
            allow all;

            proxy_pass http://shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
